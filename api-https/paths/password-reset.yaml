post:
  tags:
    - Utilisateurs
  summary: Réinitialiser le mot de passe
  description: Demande la réinitialisation du mot de passe pour une adresse e-mail.
  operationId: resetUserPassword
  security:
    - GizwitsApplicationId: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/PasswordResetRequest
        example:
          email: utilisateur@exemple.com
  responses:
    '200':
      description: Demande de réinitialisation acceptée.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
          example: {}
