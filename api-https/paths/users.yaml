get:
  tags:
    - Utilisateurs
  summary: Obtenir les informations du compte
  description: Renvoie les informations du compte associé au jeton utilisateur.
  operationId: getUserInfo
  security:
    - GizwitsApplicationId: []
      GizwitsUserToken: []
  responses:
    '200':
      description: Informations du compte utilisateur.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserInfo
          example:
            uid: example-user-id
            is_anonymous: false
            username: null
            email: utilisateur@exemple.com
            phone: null
            name: null
            gender: null
            birthday: null
            address: null
            remark: null
            lang: en
    '400':
      description: Jeton utilisateur ou identifiant d'application invalide.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserError
          examples:
            invalidToken:
              summary: Jeton utilisateur invalide
              value:
                error_message: token invalid!
                error_code: 9004
                detail_message: null
            invalidAppId:
              summary: Identifiant d'application invalide
              value:
                error_message: appid invalid!
                error_code: 9003
                detail_message: null

post:
  tags:
    - Utilisateurs
  summary: Créer un utilisateur
  description: Crée un compte utilisateur avec une adresse e-mail et un mot de passe.
  operationId: createUser
  security:
    - GizwitsApplicationId: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/UserCreateRequest
        example:
          email: utilisateur@exemple.com
          password: mot-de-passe
  responses:
    '201':
      description: Utilisateur créé avec succès.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LoginSuccess
          example:
            token: example-user-token
            uid: example-user-id
            expire_at: 1801237261
    '400':
      description: Adresse e-mail ou mot de passe invalide.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserError
          examples:
            emailAlreadyExists:
              summary: Adresse e-mail déjà utilisée
              value:
                error_message: email already exists!
                error_code: 9022
                detail_message: 该邮箱已绑定其他帐号
            weakPassword:
              summary: Mot de passe trop faible
              value:
                error_message: weak password not allowed.
                error_code: 9075
                detail_message: password needs to be set more than 6 bits
            invalidEmail:
              summary: Adresse e-mail invalide
              value:
                error_message: form_invalid
                error_code: 9015
                detail_message: email address is not valid

delete:
  tags:
    - Utilisateurs
  summary: Supprimer le compte utilisateur
  description: Supprime le compte associé au jeton utilisateur. Aucun corps de requête n'est envoyé.
  operationId: deleteUser
  security:
    - GizwitsApplicationId: []
      GizwitsUserToken: []
  responses:
    '204':
      description: Compte supprimé avec succès. La réponse ne contient pas de corps.
    '400':
      description: Jeton utilisateur invalide.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserError
          example:
            error_message: token invalid!
            error_code: 9004
            detail_message: null

put:
  tags:
    - Utilisateurs
  summary: Changer le mot de passe
  description: Remplace le mot de passe du compte associé au jeton utilisateur.
  operationId: changeUserPassword
  security:
    - GizwitsApplicationId: []
      GizwitsUserToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/UserPasswordChangeRequest
        example:
          old_pwd: ancien-mot-de-passe
          new_pwd: nouveau-mot-de-passe
  responses:
    '200':
      description: Mot de passe mis à jour.
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UserPasswordChangeResponse
          example:
            updatedAt: '2026-10-28T07:13:58.381131'
