openapi: 3.0.3
info:
  title: API HTTPS Heatzy
  description: Documentation de l'API HTTPS Heatzy, hébergée sur la plateforme Gizwits.
  version: 1.0.0
servers:
  - url: https://euapi.gizwits.com
    description: Serveur Europe Gizwits
paths:
  /app/login:
    $ref: ./paths/authentication.yaml
  /app/bindings:
    $ref: ./paths/devices.yaml
components:
  securitySchemes:
    GizwitsApplicationId:
      type: apiKey
      in: header
      name: X-Gizwits-Application-Id
      description: |
        Identifiant public de l'application Heatzy auprès de Gizwits.

        Valeur : `c70a66ff039d41b4a220e198b0fcc8b3`
    GizwitsUserToken:
      type: apiKey
      in: header
      name: X-Gizwits-User-token
      description: Jeton utilisateur obtenu avec `POST /app/login`.
  schemas:
    LoginRequest:
      $ref: ./components/schemas/authentication.yaml#/LoginRequest
    LoginSuccess:
      $ref: ./components/schemas/authentication.yaml#/LoginSuccess
    LoginError:
      $ref: ./components/schemas/authentication.yaml#/LoginError
    Device:
      $ref: ./components/schemas/devices.yaml#/Device
    DeviceListResponse:
      $ref: ./components/schemas/devices.yaml#/DeviceListResponse
    DeviceError:
      $ref: ./components/schemas/devices.yaml#/DeviceError
