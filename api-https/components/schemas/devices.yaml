DeviceListResponse:
  type: object
  required:
    - devices
  properties:
    devices:
      type: array
      description: Appareils associés au compte.
      items:
        $ref: '#/Device'

Device:
  type: object
  description: Informations d'un appareil renvoyées par Gizwits.
  additionalProperties: true
  properties:
    did:
      type: string
      description: Identifiant unique de l'appareil.
      example: example-device-id
    product_key:
      type: string
      description: Identifiant du produit Gizwits.
      example: example-product-key
    product_name:
      type: string
      description: Nom du produit.
      example: Glow_Simple_ble
    dev_alias:
      type: string
      description: Nom attribué à l'appareil par l'utilisateur.
      example: Radiateur salon
    is_online:
      type: boolean
      description: Indique si l'appareil est actuellement en ligne.
      example: true

DeviceError:
  type: object
  description: Erreur renvoyée par les endpoints liés aux appareils.
  required:
    - error_message
    - error_code
  properties:
    error_message:
      type: string
      description: Message d'erreur lisible.
      example: token invalid!
    error_code:
      type: integer
      description: Code d'erreur Gizwits.
      example: 9004
    detail_message:
      type: string
      nullable: true
      description: Message détaillé éventuellement fourni par Gizwits.

DeviceStateResponse:
  type: object
  description: Dernier état connu et points de données d'un appareil.
  required:
    - did
    - updated_at
    - attr
  properties:
    did:
      type: string
      description: Identifiant unique de l'appareil.
      example: kbWS4yHv0ERiaUEYOITc8g
    updated_at:
      type: integer
      format: int64
      description: Horodatage de la dernière mise à jour, en secondes Unix.
      example: 1801237261
    attr:
      type: object
      description: |
        Points de données de l'appareil. Leur structure dépend du produit.
        Consulte la documentation de chaque produit pour leur signification.
      additionalProperties: true

DeviceControlRequest:
  type: object
  description: Commande envoyée à un appareil.
  required:
    - attrs
  properties:
    attrs:
      type: object
      description: |
        Points de données à modifier et leurs nouvelles valeurs.
        Les clés et valeurs autorisées dépendent du produit.
      additionalProperties: true
      example:
        mode: 2

RemoveDeviceBindingsRequest:
  type: object
  description: Liste des appareils à retirer du compte.
  required:
    - devices
  properties:
    devices:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - did
        properties:
          did:
            type: string
            description: Identifiant unique de l'appareil à retirer.
            example: YVAPcxDcvteIFNbXPnKgrZ
