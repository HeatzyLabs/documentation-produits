sendSubscribeRequest:
  action: send
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: S'abonner aux notifications d'un ou plusieurs appareils.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/subscribeRequest"
receiveSubscribeResponse:
  action: receive
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: Recevoir le résultat des abonnements demandés.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/subscribeResponse"
