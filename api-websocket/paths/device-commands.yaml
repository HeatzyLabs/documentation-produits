sendReadCommand:
  action: send
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: Demander les points de données d'un appareil.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/readCommand"
sendWriteCommand:
  action: send
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: Envoyer une commande à un appareil.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/writeCommand"
receiveDeviceNotification:
  action: receive
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: Recevoir l'état, une mise à jour ou la réponse d'un appareil.
  description: |
    Une notification peut être émise juste après `login_res` lorsque
    `auto_subscribe` est défini à `true`, puis à chaque mise à jour d'état.
    Elle ne nécessite un `c2s_ack` que si elle contient un champ `req_sn`.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/deviceNotification"
sendDeviceAcknowledgement:
  action: send
  channel:
    $ref: "../asyncapi.yaml#/channels/websocketSession"
  summary: Acquitter une notification d'appareil.
  description: |
    Obligatoire lorsqu'une notification `s2c_noti` contient un champ `req_sn`.
  messages:
    - $ref: "../asyncapi.yaml#/channels/websocketSession/messages/deviceAcknowledgement"
