<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>API WebSocket Heatzy</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@asyncapi/react-component@3.2.1/styles/default.min.css"
    >
  </head>
  <body>
    <main id="asyncapi" aria-label="Documentation de l'API WebSocket Heatzy"></main>

    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/@asyncapi/react-component@3.2.1/browser/standalone/index.js"></script>
    <script>
      const target = document.getElementById("asyncapi");

      async function loadYaml(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Impossible de charger ${path} (${response.status}).`);
        }
        return jsyaml.load(await response.text());
      }

      async function renderDocumentation() {
        const [
          specification,
          authentication,
          subscriptions,
          deviceCommands,
          events,
          heartbeat,
          authenticationComponents,
          subscriptionComponents,
          deviceCommandComponents,
          eventComponents,
          heartbeatComponents,
        ] = await Promise.all([
          loadYaml("./asyncapi.yaml"),
          loadYaml("./paths/authentication.yaml"),
          loadYaml("./paths/subscriptions.yaml"),
          loadYaml("./paths/device-commands.yaml"),
          loadYaml("./paths/events.yaml"),
          loadYaml("./paths/heartbeat.yaml"),
          loadYaml("./components/authentication.yaml"),
          loadYaml("./components/subscriptions.yaml"),
          loadYaml("./components/device-commands.yaml"),
          loadYaml("./components/events.yaml"),
          loadYaml("./components/heartbeat.yaml"),
        ]);

        specification.components = {
          messages: {
            LoginRequest: authenticationComponents.LoginRequest,
            LoginResponse: authenticationComponents.LoginResponse,
            SubscribeRequest: subscriptionComponents.SubscribeRequest,
            SubscribeResponse: subscriptionComponents.SubscribeResponse,
            ReadCommand: deviceCommandComponents.ReadCommand,
            WriteCommand: deviceCommandComponents.WriteCommand,
            DeviceNotification: deviceCommandComponents.DeviceNotification,
            OnlineStatus: eventComponents.OnlineStatus,
            InvalidMessage: eventComponents.InvalidMessage,
            HeartbeatPing: heartbeatComponents.HeartbeatPing,
            HeartbeatPong: heartbeatComponents.HeartbeatPong,
          },
          schemas: {
            SubscriptionResult: subscriptionComponents.SubscriptionResult,
          },
        };

        specification.operations = {
          ...authentication,
          ...subscriptions,
          ...deviceCommands,
          ...events,
          ...heartbeat,
        };

        const operationMessages = {
          sendLoginRequest: "loginRequest",
          receiveLoginResponse: "loginResponse",
          sendSubscribeRequest: "subscribeRequest",
          receiveSubscribeResponse: "subscribeResponse",
          sendReadCommand: "readCommand",
          sendWriteCommand: "writeCommand",
          receiveDeviceNotification: "deviceNotification",
          receiveOnlineStatus: "onlineStatus",
          receiveInvalidMessage: "invalidMessage",
          sendHeartbeatPing: "heartbeatPing",
          receiveHeartbeatPong: "heartbeatPong",
        };

        for (const [operationId, messageId] of Object.entries(operationMessages)) {
          const operation = specification.operations[operationId];
          operation.channel.$ref = "#/channels/websocketSession";
          operation.messages[0].$ref = `#/channels/websocketSession/messages/${messageId}`;
        }

        for (const result of [
          specification.components.messages.SubscribeResponse.payload.properties.data.properties.success,
          specification.components.messages.SubscribeResponse.payload.properties.data.properties.failed,
        ]) {
          result.items.$ref = "#/components/schemas/SubscriptionResult";
        }

        AsyncApiStandalone.render(
          {
            schema: specification,
            config: { show: { sidebar: true } },
          },
          target,
        );
      }

      renderDocumentation().catch((error) => {
        target.textContent = `Impossible d'afficher la documentation : ${error.message}`;
      });
    </script>
  </body>
</html>
