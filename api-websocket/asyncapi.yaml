asyncapi: 3.0.0
info:
  title: API WebSocket Heatzy
  description: |
    Documentation du protocole WebSocket Heatzy.

    Cette spécification décrit les échanges temps réel en JSON.
  version: 0.1.0
defaultContentType: application/json
servers:
  gizwits:
    host: eum2m.gizwits.com:8880
    pathname: /ws/app/v1
    protocol: wss
    title: Passerelle Gizwits
    description: |
      Passerelle WebSocket sécurisée Gizwits pour l'infrastructure Europe.
      URL : `wss://eum2m.gizwits.com:8880/ws/app/v1`.
channels:
  websocketSession:
    address: null
    title: Session WebSocket
    description: Flux JSON partagé par toutes les opérations WebSocket.
    messages:
      loginRequest:
        $ref: "#/components/messages/LoginRequest"
      loginResponse:
        $ref: "#/components/messages/LoginResponse"
      subscribeRequest:
        $ref: "#/components/messages/SubscribeRequest"
      subscribeResponse:
        $ref: "#/components/messages/SubscribeResponse"
      readCommand:
        $ref: "#/components/messages/ReadCommand"
      writeCommand:
        $ref: "#/components/messages/WriteCommand"
      deviceNotification:
        $ref: "#/components/messages/DeviceNotification"
operations:
  sendLoginRequest:
    $ref: "./paths/authentication.yaml#/sendLoginRequest"
  receiveLoginResponse:
    $ref: "./paths/authentication.yaml#/receiveLoginResponse"
  sendSubscribeRequest:
    $ref: "./paths/subscriptions.yaml#/sendSubscribeRequest"
  receiveSubscribeResponse:
    $ref: "./paths/subscriptions.yaml#/receiveSubscribeResponse"
  sendReadCommand:
    $ref: "./paths/device-commands.yaml#/sendReadCommand"
  sendWriteCommand:
    $ref: "./paths/device-commands.yaml#/sendWriteCommand"
  receiveDeviceNotification:
    $ref: "./paths/device-commands.yaml#/receiveDeviceNotification"
components:
  messages:
    LoginRequest:
      $ref: "./components/authentication.yaml#/LoginRequest"
    LoginResponse:
      $ref: "./components/authentication.yaml#/LoginResponse"
    SubscribeRequest:
      $ref: "./components/subscriptions.yaml#/SubscribeRequest"
    SubscribeResponse:
      $ref: "./components/subscriptions.yaml#/SubscribeResponse"
    ReadCommand:
      $ref: "./components/device-commands.yaml#/ReadCommand"
    WriteCommand:
      $ref: "./components/device-commands.yaml#/WriteCommand"
    DeviceNotification:
      $ref: "./components/device-commands.yaml#/DeviceNotification"
  schemas:
    SubscriptionResult:
      $ref: "./components/subscriptions.yaml#/SubscriptionResult"
